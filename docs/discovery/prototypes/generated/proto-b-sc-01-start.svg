<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">PROTO-B SC-01 目标简报</title><desc id="description">导航、表格和卡片承担任务，解释以内联帮助呈现。</desc><rect width="1200" height="760" fill="#f4f6f9"/><text x="40" y="58" font-size="28" font-weight="700" fill="#172033">PROTO-B · 纯 Web 工作台</text><text x="40" y="100" font-size="22" font-weight="700" fill="#5f6b7a">SC-01 · 从投放目标到可审核广告草稿</text><rect x="40" y="118" width="1120" height="30" rx="8" fill="#e8eefc"/><text x="58" y="140" font-size="15" font-weight="700" fill="#315efb">脱敏示例 · 无真实 Meta 连接 · 无写操作</text><rect x="40" y="160" width="210" height="480" rx="16" fill="#ffffff" stroke="#cfd7e3"/><text x="60" y="194" font-size="18" font-weight="700" fill="#172033">导航</text><text x="75" y="230" font-size="18" font-weight="700" fill="#172033">总览</text><text x="75" y="275" font-size="18" font-weight="400" fill="#172033">素材</text><text x="75" y="320" font-size="18" font-weight="400" fill="#172033">广告草稿</text><text x="75" y="365" font-size="18" font-weight="400" fill="#172033">数据分析</text><text x="75" y="410" font-size="18" font-weight="400" fill="#172033">素材测试</text><rect x="270" y="160" width="890" height="480" rx="16" fill="#ffffff" stroke="#cfd7e3"/><text x="290" y="194" font-size="18" font-weight="700" fill="#172033">目标简报</text><text x="300" y="220" font-size="22" font-weight="700" fill="#172033">为夏季课程生成广告草稿</text><rect x="300" y="260" width="760" height="44" rx="10" fill="#f4f6f9"/><text x="314" y="288" font-size="16" font-weight="400" fill="#172033">目标：未选择</text><rect x="300" y="318" width="760" height="44" rx="10" fill="#f4f6f9"/><text x="314" y="346" font-size="16" font-weight="400" fill="#172033">受众：城市家长</text><rect x="300" y="376" width="760" height="44" rx="10" fill="#f4f6f9"/><text x="314" y="404" font-size="16" font-weight="400" fill="#172033">落地页：未填写</text><rect x="300" y="455" width="760" height="80" rx="12" fill="#eef3ff"/><text x="320" y="490" font-size="17" font-weight="400" fill="#172033">检测到 2 项关键缺失，不能生成可审核草稿。</text><text x="320" y="520" font-size="15" font-weight="700" fill="#315efb">广告状态：未发布</text><rect x="300" y="555" width="760" height="54" rx="12" fill="#315efb"/><text x="318" y="589" font-size="17" font-weight="700" fill="#ffffff">补充投放目标与落地页</text><text x="40" y="710" font-size="16" font-weight="700" fill="#5f6b7a">阶段 1/3</text><text x="150" y="710" font-size="16" font-weight="400" fill="#5f6b7a">导航、表格和卡片承担任务，解释以内联帮助呈现。</text></svg>
