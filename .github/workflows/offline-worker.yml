name: Offline Worker

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "services/control-plane-worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/offline-worker.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "services/control-plane-worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/offline-worker.yml"

permissions:
  contents: read

jobs:
  offline-worker:
    name: Validate offline Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate generated types, TypeScript, migrations, and fixtures
        run: npm run worker:check
