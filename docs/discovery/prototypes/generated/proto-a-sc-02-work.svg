<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description"><title id="title">PROTO-A SC-02 异常与证据</title><desc id="description">会话承担主要任务，右侧只显示对象状态和安全边界。</desc><rect width="1200" height="760" fill="#f4f6f9"/><text x="40" y="58" font-size="28" font-weight="700" fill="#172033">PROTO-A · 对话主导</text><text x="40" y="100" font-size="22" font-weight="700" fill="#5f6b7a">SC-02 · 从只读投放数据到诊断与行动建议</text><rect x="40" y="118" width="1120" height="30" rx="8" fill="#e8eefc"/><text x="58" y="140" font-size="15" font-weight="700" fill="#315efb">脱敏示例 · 无真实 Meta 连接 · 无写操作</text><rect x="40" y="160" width="770" height="480" rx="16" fill="#ffffff" stroke="#cfd7e3"/><text x="60" y="194" font-size="18" font-weight="700" fill="#172033">对话任务</text><text x="78" y="220" font-size="21" font-weight="700" fill="#172033">点击率稳定，但转化率下降</text><rect x="70" y="255" width="700" height="110" rx="14" fill="#eef3ff"/><text x="92" y="292" font-size="18" font-weight="400" fill="#172033">追踪缺失支持测量异常假设；尚不能证明广告素材失效。</text><rect x="70" y="550" width="700" height="54" rx="12" fill="#315efb"/><text x="88" y="584" font-size="17" font-weight="700" fill="#ffffff">查看支持证据与反证</text><rect x="830" y="160" width="330" height="480" rx="16" fill="#ffffff" stroke="#cfd7e3"/><text x="850" y="194" font-size="18" font-weight="700" fill="#172033">对象状态</text><rect x="858" y="220" width="270" height="44" rx="10" fill="#f4f6f9"/><text x="872" y="248" font-size="16" font-weight="400" fill="#172033">CTR：稳定</text><rect x="858" y="278" width="270" height="44" rx="10" fill="#f4f6f9"/><text x="872" y="306" font-size="16" font-weight="400" fill="#172033">CVR：下降</text><rect x="858" y="336" width="270" height="44" rx="10" fill="#f4f6f9"/><text x="872" y="364" font-size="16" font-weight="400" fill="#172033">落地页事件：缺失 8%</text><rect x="850" y="455" width="286" height="100" rx="12" fill="#fff4dc"/><text x="870" y="492" font-size="17" font-weight="700" fill="#172033">低置信度 · 不得表述为因果</text><text x="40" y="710" font-size="16" font-weight="700" fill="#5f6b7a">阶段 2/3</text><text x="150" y="710" font-size="16" font-weight="400" fill="#5f6b7a">会话承担主要任务，右侧只显示对象状态和安全边界。</text></svg>
