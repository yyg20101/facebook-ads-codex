name: Documentation

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/validate-docs.mjs"
      - "scripts/prepare-facebook-ads-analysis-forward-test.mjs"
      - "scripts/score-facebook-ads-analysis-forward-test.mjs"
      - ".agents/skills/facebook-ads-*/**"
      - "evals/facebook-ads-*/**"
      - "tests/facebook-ads-*.test.mjs"
      - ".agents/skills/facebook-ads-analysis/**"
      - "evals/facebook-ads-analysis/**"
      - "tests/facebook-ads-analysis-skill.test.mjs"
      - "tests/facebook-ads-analysis-evals.test.mjs"
      - "tests/facebook-ads-analysis-forward-test.test.mjs"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/validate-docs.mjs"
      - "scripts/prepare-facebook-ads-analysis-forward-test.mjs"
      - "scripts/score-facebook-ads-analysis-forward-test.mjs"
      - ".agents/skills/facebook-ads-*/**"
      - "evals/facebook-ads-*/**"
      - "tests/facebook-ads-*.test.mjs"
      - ".agents/skills/facebook-ads-analysis/**"
      - "evals/facebook-ads-analysis/**"
      - "tests/facebook-ads-analysis-skill.test.mjs"
      - "tests/facebook-ads-analysis-evals.test.mjs"
      - "tests/facebook-ads-analysis-forward-test.test.mjs"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run docs:check

      - name: Validate offline Codex Skills
        run: npm run skill:check
